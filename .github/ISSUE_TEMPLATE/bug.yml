name: Bug report
description: Something does not build, test or behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        AgentAuth is an unaudited devnet prototype. If this is a security vulnerability, do not file it here: use the Security tab of this repository (Report a vulnerability).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core program, relay, mock-amm / gated-example, cpi crate, sdk, cli, mcp, guard, registry, dashboard, demo, docs, ci]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (exact commands)
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, solana --version, rustc -V, node -v, pnpm -v, commit hash
    validations: { required: true }
