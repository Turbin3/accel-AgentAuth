[package]
name = "agent-auth"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "0.9.3"
pinocchio-system = "0.4.0"
pinocchio-pubkey = "0.3"

[dev-dependencies]
litesvm = "0.12.0"
solana-account = "3.4.0"
solana-commitment-config = "3"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "3.1.0"
solana-pubkey = "3.0.0"
solana-rpc-client = "3"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = "3.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
